<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

body{
    width: 1920px;
    height: 2160px;
    margin: 0 auto;
    font-size: 13pt;
    font-family: Bebas Neue;
    color: white
}

.container{
    position: absolute;
    justify-content: space-between;
    display: flex;
    margin: 93px 260px;
    width: 421px;
    height: 19px;
}

.bottom{
    position: absolute;
    width: 235px;
    height: 186px;
    margin: 750px 106px;
}

.item1{
    font-size: 25pt;
}

.item2{
    font-size: 55pt;
    margin: -10px 0;
}

.item3{
    font-size: 25pt;
}

.item4{
    font-size: 16pt;
    text-decoration: underline;
}

.logo{
    position: absolute;
    margin: 88px 105px;
}

.tools{
    display: flex;
    position: absolute;
    margin: 93px 1631px;
    width: 219px;
    height: 19px;
}

.dealer{
    position: absolute;
    margin: 95px 1697px;
    font-size: 15px;
    width: 100px;
}

.boxes{
    font-size: 14pt;
    display: flex;
    position: absolute;
    margin: 982px 105px;
    justify-content: space-between;
    width: 375px;
    height: 40px;
}

.item5{
    background-color: white;
    border-radius: 20px;
    color: black;
    padding: 10px 40px;
}

.item6{
    border-radius: 20px;
    border: 1px white solid;
    padding: 10px 45px;
}

.hero{
    width: 100%;
}

</style>

</head>

<body>
    
 <div class="container"> 
    <div>VEHICLES</div>
    <div>SHOP</div>
    <div>SUPPORT & SERVICE</div>
    <div>FORD PRO SOLUTIONS</div>
 </div>

<div>
    <div class="dealer">LOCATE DEALER</div>
</div>

<div class="bottom">
    <div class="item1">2026</div>
    <div class="item2">ESCAPE&REG;</div>
    <div class="item3">STARTING AT $30,350 <sup>1</sup></div>
    <div class="item4">DETAILS</div>
</div>

<div class="boxes">
    <div class="item5">SEARCH INVENTORY</div>
    <div class="item6">2025 ESCAPE</div>
</div>

<img class="logo" src="img/Wireframing/logo.png" alt="">
<img class="tools" src="img/Wireframing/tools.png" alt="">
<img class="hero" src="img/Wireframing/background.png" alt="">



</body>
